<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>应用图标候选 · 印记</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #F2F2F7; color: #1C1C1E; padding: 36px 28px; }
  h1 { font-size: 20px; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #6B7280; margin-bottom: 28px; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .card { background: #FFF; border-radius: 16px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .card h2 { font-size: 16px; margin-bottom: 4px; }
  .card .desc { font-size: 12.5px; color: #6B7280; line-height: 1.6; min-height: 40px; margin-bottom: 14px; }
  .row { display: flex; align-items: flex-end; gap: 18px; }
  .light, .dark { border-radius: 14px; padding: 14px; display: flex; align-items: flex-end; gap: 14px; }
  .light { background: #F7F8FA; }
  .dark { background: #101418; margin-top: 10px; }
  img { display: block; }
  .s1 { width: 160px; height: 160px; border-radius: 36px; }
  .s2 { width: 80px; height: 80px; border-radius: 20px; }
  .s3 { width: 44px; height: 44px; border-radius: 11px; }
  .pick { margin-top: 14px; font-size: 13px; color: #007AFF; font-weight: 600; }
</style>
</head>
<body>
  <h1>应用图标候选</h1>
  <p class="sub">1024 设计稿，按桌面/列表/通知三种尺寸预览（圆角为系统遮罩示意）。选定后告诉我字母（A/B/C/D），我会生成全套资源：应用图标、Android 自适应图标（前景/背景/单色）、启动屏图标、favicon，并可按你的意见微调。</p>
  <div class="grid" id="grid"></div>
  <p class="pick">回复字母选择 · 也可以说"要 D 但底色换成 xx"这类组合要求</p>
</body>
<script>
  const C = {};

  // A 航线：深蓝渐变 + 虚线航弧 + 飞机 + 起终点
  C.A = `
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
    <defs>
      <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#123B7A"/><stop offset="1" stop-color="#2F7BF6"/>
      </linearGradient>
    </defs>
    <rect width="1024" height="1024" fill="url(#bgA)"/>
    <circle cx="850" cy="820" r="300" fill="#FFFFFF" opacity="0.06"/>
    <path d="M 210 790 C 400 720, 470 560, 560 430 C 640 310, 720 250, 826 220"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="13"
          stroke-dasharray="2 36" stroke-linecap="round"/>
    <circle cx="210" cy="790" r="38" fill="#FFFFFF"/>
    <circle cx="210" cy="790" r="15" fill="#2F7BF6"/>
    <circle cx="826" cy="220" r="18" fill="#FFFFFF"/>
    <g transform="translate(430 218) scale(15) rotate(42 12 12)">
      <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"
            fill="#FFFFFF"/>
    </g>
  </svg>`;

  // B 印记·定位：暖红渐变 + 白色定位大头针
  C.B = `
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
    <defs>
      <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#F97316"/><stop offset="1" stop-color="#E11D48"/>
      </linearGradient>
    </defs>
    <rect width="1024" height="1024" fill="url(#bgB)"/>
    <circle cx="790" cy="250" r="230" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="28"/>
    <circle cx="210" cy="840" r="150" fill="#FFFFFF" opacity="0.08"/>
    <g transform="translate(152 128) scale(30)">
      <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"
            fill="none" stroke="#FFFFFF" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="10" r="3" fill="#FFFFFF"/>
    </g>
  </svg>`;

  // C 票根：靛紫渐变 + 白色车票（票根缺口 + 打孔虚线）
  C.C = `
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
    <defs>
      <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#4338CA"/><stop offset="1" stop-color="#7C3AED"/>
      </linearGradient>
    </defs>
    <rect width="1024" height="1024" fill="url(#bgC)"/>
    <circle cx="180" cy="200" r="260" fill="#FFFFFF" opacity="0.05"/>
    <g transform="rotate(-8 512 512)">
      <rect x="182" y="372" width="660" height="280" rx="40" fill="#FFFFFF"/>
      <circle cx="182" cy="512" r="42" fill="url(#bgC)"/>
      <circle cx="842" cy="512" r="42" fill="url(#bgC)"/>
      <line x1="632" y1="396" x2="632" y2="628" stroke="url(#bgC)" stroke-width="9" stroke-dasharray="4 22" stroke-linecap="round"/>
      <g transform="translate(672 448) scale(9)">
        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="#4338CA"/>
      </g>
      <rect x="248" y="466" width="290" height="26" rx="13" fill="#4338CA" opacity="0.88"/>
      <rect x="248" y="524" width="200" height="26" rx="13" fill="#4338CA" opacity="0.45"/>
    </g>
  </svg>`;

  // D 轨迹：深蓝夜色 + 三节点折线（对应地图的出行轨迹）
  C.D = `
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
    <defs>
      <linearGradient id="bgD" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#2563EB"/>
      </linearGradient>
    </defs>
    <rect width="1024" height="1024" fill="url(#bgD)"/>
    <circle cx="850" cy="180" r="240" fill="#FFFFFF" opacity="0.05"/>
    <path d="M 240 780 L 512 560 L 784 300" fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="240" cy="780" r="46" fill="#FFFFFF"/>
    <circle cx="240" cy="780" r="17" fill="#1E40AF"/>
    <circle cx="512" cy="560" r="26" fill="#FFFFFF"/>
    <circle cx="784" cy="300" r="44" fill="#FFFFFF"/>
    <circle cx="784" cy="300" r="16" fill="#1E40AF"/>
  </svg>`;

  const META = {
    A: { t: 'A · 航线', d: '深蓝渐变 + 虚线航弧与飞机，呼应"旅票/出行"主题，列表缩小后依然清晰。' },
    B: { t: 'B · 印记·定位', d: '暖橙红渐变 + 定位大头针，呼应应用名"印记"与"地点"记录，最有辨识度。' },
    C: { t: 'C · 票根', d: '靛紫渐变 + 一张打孔车票，直接表达"旅票收藏"的概念，风格偏活泼。' },
    D: { t: 'D · 轨迹', d: '深蓝夜色 + 三节点轨迹线，对应地图页的出行轨迹，风格最沉稳。' },
  };

  const grid = document.getElementById('grid');
  Object.keys(C).forEach(k => {
    const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(C[k].trim());
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h2>${META[k].t}</h2>
      <div class="desc">${META[k].d}</div>
      <div class="light"><img class="s1" src="${src}"><img class="s2" src="${src}"><img class="s3" src="${src}"></div>
      <div class="dark"><img class="s1" src="${src}"><img class="s2" src="${src}"><img class="s3" src="${src}"></div>
    `;
    grid.appendChild(card);
  });
</script>
</body>
</html>
