# 用 GitHub Actions 直接出 Android APK（不消耗 Expo/EAS 的构建额度）
#
# 用法：仓库 → Actions → 「构建 Android APK」→ Run workflow（只手动触发，不自动跑）
#   跑完两处可下载：① 该次运行的 Artifacts（保留 90 天）
#                   ② Releases 里的 apk-latest（长期有效，链接固定，适合发给别人）
#
# 说明：
# - 走 expo prebuild + gradlew，和 EAS 无关，不受 EAS 每月免费额度限制。
# - 只打 arm64-v8a + armeabi-v7a 两种 ABI，包体积比四种全打小一半左右。
# - 下载 Gradle / Android SDK / NDK 都发生在 GitHub 的构建机器上（云端）。
# - **签名**：配好下面四个 Secrets 就用你自己的 keystore 签 release 包；没配则沿用模板自带
#   的公开 debug key（能装，但部分手机会拦、也无法覆盖安装用你自己 key 签过的包）。
#   签名配置由 scripts/apply-release-signing.mjs 注入，构建完还会校验指纹是否和 keystore 一致。
#   配置方法见仓库 README 的「发布与签名」一节。
name: 构建 Android APK

on:
  # 只手动触发：Actions → 「构建 Android APK」→ Run workflow
  workflow_dispatch:

permissions:
  contents: write        # 发布 Release 需要写权限

defaults:
  run:
    working-directory: lifelog-app

jobs:
  build:
    name: assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lifelog-app/package-lock.json

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装依赖
        run: npm ci

      - name: 生成原生工程（expo prebuild）
        run: npx expo prebuild --platform android --no-install

      - name: 按工程要求装 Android SDK 组件
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          COMPILE_SDK=$(grep -oE 'compileSdkVersion *= *[0-9]+' android/build.gradle | grep -oE '[0-9]+' | head -1)
          BUILD_TOOLS=$(grep -oE 'buildToolsVersion *= *"[^"]+"' android/build.gradle | grep -oE '[0-9.]+' | head -1)
          NDK=$(grep -oE 'ndkVersion *= *"[^"]+"' android/build.gradle | grep -oE '[0-9.]+' | head -1)
          COMPILE_SDK=${COMPILE_SDK:-36}
          BUILD_TOOLS=${BUILD_TOOLS:-36.0.0}
          NDK=${NDK:-27.1.12297006}
          echo "compileSdk=$COMPILE_SDK buildTools=$BUILD_TOOLS ndk=$NDK"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-$COMPILE_SDK" \
            "build-tools;$BUILD_TOOLS" \
            "ndk;$NDK" \
            "cmake;3.22.1"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('lifelog-app/android/**/*.gradle*', 'lifelog-app/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 写入签名密钥（配了 Secrets 就用你的 keystore，没配沿用模板 debug 签名）
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::没有配置 ANDROID_KEYSTORE_BASE64，本次仍用模板自带的公开 debug key 签名：能安装，但部分手机的安装器/安全扫描会拦，也无法覆盖安装用你自己 key 签过的包。"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::配了 ANDROID_KEYSTORE_BASE64，但 ANDROID_STORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD 有空值，四个 Secret 要一起配。"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          chmod 600 android/app/release.jks
          node scripts/apply-release-signing.mjs android/app/build.gradle android/app/release.jks
          # 把改写结果的关键片段打到日志：签名配置没生效时一眼能看出来（不含任何密码）
          grep -n -A 12 "signingConfigs {" android/app/build.gradle || true
          grep -n -A 6 "buildTypes {" android/app/build.gradle || true
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: 打包 Release APK（只打 arm64 / arm 32 位，体积减半）
        env:
          # build.gradle 里读的就是这三个环境变量：密码不进命令行，免得被打进构建日志
          RC_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          RC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: 校验 APK 签名（拿 APK 的证书指纹和 keystore 逐字符比对）
        id: verify
        env:
          RC_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          RC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          # runner 上一般都有 ANDROID_HOME；万一没有，按常见安装位置兜一下
          if [ -z "$SDK_ROOT" ]; then
            for c in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -d "$c" ]; then SDK_ROOT="$c"; break; fi
            done
          fi
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls -1 "$SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          echo "APK: $APK"
          echo "apksigner: $APKSIGNER"
          # 指纹就两种长相：32 组两位十六进制用冒号连起来，或者 64 位十六进制连在一起。
          # 直接按这个模式找，不按标签解析、也不先把冒号删掉——否则标签里的字符（SHA256）
          # 会和指纹粘成一串，64 位的窗口就被截错位了
          DIGEST_RE="([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}|[0-9A-Fa-f]{64}"
          VERIFY_RC=0
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 | tee /tmp/apk-certs.txt || VERIFY_RC=$?
          else
            echo "::warning::没找到 apksigner，改用 keytool 读 APK 里的 v1 证书来比对"
            : > /tmp/apk-certs.txt
          fi
          if [ -n "$APKSIGNER" ] && [ "$VERIFY_RC" != "0" ]; then
            echo "::error::apksigner verify 没通过（exit $VERIFY_RC），APK 的签名有问题，看上面的原始输出"
            exit 1
          fi
          ACTUAL=$(grep -oE "$DIGEST_RE" /tmp/apk-certs.txt | head -1 | tr -d ":" | tr "A-F" "a-f" || true)
          if [ -z "$ACTUAL" ]; then
            # 兜底：v1 签名（构建里开着 enableV1Signing）可以直接从 META-INF 里读证书
            ACTUAL=$(keytool -printcert -jarfile "$APK" 2>/dev/null | grep -oE "$DIGEST_RE" | head -1 | tr -d ":" | tr "A-F" "a-f" || true)
          fi
          echo "APK 证书 SHA-256：${ACTUAL:-（没解析出来，见上面的原始输出）}"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            EXPECTED=$(keytool -list -v -keystore android/app/release.jks -storepass "$RC_STORE_PASSWORD" -alias "$RC_KEY_ALIAS" 2>/dev/null \
              | grep -oE "$DIGEST_RE" | head -1 | tr -d ":" | tr "A-F" "a-f" || true)
            if [ -z "$EXPECTED" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::APK 的签名指纹和 keystore 对不上（keystore=${EXPECTED:-解析失败} apk=${ACTUAL:-解析失败}）"
              exit 1
            fi
            echo "✅ 已用你的 keystore 签名，SHA-256：$ACTUAL"
          else
            echo "::warning::本次用的是模板自带的 debug 签名，SHA-256：${ACTUAL:-未知}"
          fi
          echo "fingerprint=$ACTUAL" >> "$GITHUB_OUTPUT"
      - name: 上传为该次运行的产物
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: lifelog-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 发布到 Releases（固定链接，方便发给别人下载）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd ..
          VER=$(node -e "console.log('v'+require('./lifelog-app/app.json').expo.version)")
          CODE=$(node -e "console.log(require('./lifelog-app/app.json').expo.android.versionCode)")
          SIGNED="${{ steps.signing.outputs.signed }}"
          FP="${{ steps.verify.outputs.fingerprint }}"
          if [ "$SIGNED" = "true" ]; then
            SIGN_NOTE="已用项目自有 keystore 签名（可覆盖安装同签名的旧版本）。签名指纹 SHA-256：$FP"
          else
            SIGN_NOTE="⚠️ 本次用的是模板自带的 debug 签名（没有配置签名 Secrets）。部分手机的安装器/安全扫描会拦，也无法覆盖安装用自有 key 签过的包。"
          fi
          TAG="apk-latest"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "最新 APK（直接下载安装）" \
            --notes "每次构建自动更新。下载下面的 app-release.apk 装到 Android 手机即可（首次安装需允许「未知来源」）。"
          gh release upload "$TAG" lifelog-app/android/app/build/outputs/apk/release/*.apk --clobber
          NOTES=$(printf '版本 %s（versionCode %s）。下载下面的 app-release.apk 装到 Android 手机即可（首次安装需允许「未知来源」）。\n\n%s' "$VER" "$CODE" "$SIGN_NOTE")
          gh release edit "$TAG" --title "最新 APK  $VER (versionCode $CODE)" --notes "$NOTES"
          echo "下载页：https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

# ---------------------------------------------------------------------------
# 换成自己的签名（一次配置，之后每次构建自动生效）
#
# 1. 本机生成 keystore（JDK 自带 keytool，别把生成的 .jks 提交进仓库、也别丢，丢了就没法
#    再覆盖安装已发布的版本）：
#      keytool -genkeypair -v -keystore release.jks -alias lifelog \
#        -keyalg RSA -keysize 2048 -validity 10000 \
#        -storepass 你的库密码 -keypass 你的key密码 \
#        -dname "CN=jiyin, OU=lifelog, O=lifelog, L=Beijing, ST=Beijing, C=CN"
# 2. 转成 base64 单行：
#      Linux/macOS: base64 -w0 release.jks > keystore.b64
#      Windows:     certutil -encode release.jks keystore.b64  （取中间那几行拼成一行）
#      Node 跨平台: node -e "console.log(require('fs').readFileSync('release.jks').toString('base64'))"
# 3. 仓库 Settings → Secrets and variables → Actions → New repository secret，加四个：
#      ANDROID_KEYSTORE_BASE64   上面那串 base64
#      ANDROID_STORE_PASSWORD    keystore 库密码
#      ANDROID_KEY_ALIAS         keytool 里的 -alias（例：lifelog）
#      ANDROID_KEY_PASSWORD      key 密码（和库密码相同就填一样）
# 4. 再手动跑一次「构建 Android APK」，日志里会打印 APK 的证书 SHA-256，和 keystore 对不上会直接失败。
#
# 注意：手机上如果已经装了「模板 debug 签名」或其它签名版本的旧包，第一次装自有签名的包需要
# 先卸载旧版（签名不同无法覆盖安装）；之后同签名的更新都能直接覆盖安装。
# ---------------------------------------------------------------------------