# 用 GitHub Actions 的免费 macOS 构建机直接编译 iOS 未签名 IPA
# （无需 Mac、无需付费 Apple 开发者账号，不消耗 Expo/EAS 额度）
#
# 用法：仓库 → Actions → 「构建 iOS IPA」→ Run workflow（只手动触发，不自动跑）
#   跑完在 Releases 里的 ipa-latest 下载（长期有效、链接固定，且不占私有仓库 500MB Actions Artifacts 额度）
#
# 真机安装（Windows + 免费普通 Apple ID）：
#   1. 下载 app-unsigned.ipa 到 Windows；
#   2. 用 Sideloadly（https://sideloadly.io/）或 AltStore / SideStore，登录普通免费 Apple ID；
#   3. 数据线连接 iPhone，把 IPA 拖进去直接签名安装；
#   4. 首次打开在 iPhone「设置 → 通用 → VPN 与设备管理」信任该 Apple ID 即可。
#      （免费 Apple ID 签名有效期 7 天，到期重新签一次即可；数据留在手机里不会丢。）
name: 构建 iOS IPA

on:
  workflow_dispatch:
    inputs:
      include_share_extension:
        description: '包含 iOS 分享扩展（需付费开发者账号 App Group；免费 Apple ID 用 Sideloadly 自签请保持关闭）'
        type: boolean
        default: false

permissions:
  contents: write        # 发布 Release 需要写权限

defaults:
  run:
    working-directory: lifelog-app

jobs:
  build:
    name: buildUnsignedIPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lifelog-app/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 校验自检脚本
        run: |
          node scripts/check-media-sync.mjs
          node scripts/check-live-photo.mjs
          node scripts/check-map-script.mjs
          node scripts/check-ios-compat.mjs

      - name: 按自签模式调整 Share Extension 配置
        env:
          INCLUDE_SHARE_EXT: ${{ inputs.include_share_extension }}
        run: |
          node -e '
            const fs = require("fs");
            const includeExt = process.env.INCLUDE_SHARE_EXT === "true";
            const cfg = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const plugins = cfg.expo?.plugins || [];
            for (const p of plugins) {
              if (Array.isArray(p) && p[0] === "expo-share-intent") {
                if (includeExt) {
                  delete p[1].disableIOS;
                  console.log("iOS Share Extension: ENABLED (requires App Group entitlement)");
                } else {
                  p[1].disableIOS = true;
                  console.log("iOS Share Extension: DISABLED (free Apple ID / Sideloadly compatible)");
                }
              }
            }
            fs.writeFileSync("app.json", JSON.stringify(cfg, null, 2) + "\n");
          '

      - name: 生成 iOS 原生工程（expo prebuild）
        run: npx expo prebuild --platform ios --no-install --clean

      - name: 缓存 CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('lifelog-app/ios/Podfile', 'lifelog-app/package-lock.json', 'lifelog-app/modules/**/ios/*.podspec') }}
          restore-keys: cocoapods-${{ runner.os }}-

      - name: 安装 CocoaPods 依赖
        run: |
          set -e
          cd ios
          LANG=en_US.UTF-8 pod install --deployment 2>/dev/null || LANG=en_US.UTF-8 pod install
          # 确认本地原生模块已被自动链接进 Podfile.lock
          grep -E "(Paths|Thumbs)" Podfile.lock || echo "::warning::未在 Podfile.lock 中看到 Paths/Thumbs，请检查 autolinking 日志"

      - name: 配置 Xcode Node 路径
        run: |
          echo "export NODE_BINARY=$(command -v node)" > ios/.xcode.env.local
          cat ios/.xcode.env.local

      - name: 编译未签名 Release App（arm64 真机）
        id: xcode
        run: |
          set -eo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "::error::未找到 .xcworkspace"
            exit 1
          fi
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json | node -e '
            const data = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const schemes = data.workspace?.schemes || [];
            const pick = schemes.find(s => !/Pods|Extension|Tests/i.test(s)) || schemes[0] || "";
            console.log(pick);
          ')
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"
          if [ -z "$SCHEME" ]; then
            echo "::error::无法解析主 App Scheme"
            exit 1
          fi

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: 打包为未签名 IPA 并校验 JS Bundle
        run: |
          set -e
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到编译产出的 .app 文件"
            exit 1
          fi
          echo "App bundle: $APP_PATH"
          if [ ! -f "$APP_PATH/main.jsbundle" ]; then
            echo "::error::.app 内缺少 main.jsbundle，Release JS 打包未生效"
            exit 1
          fi
          rm -rf ios/dist ios/app-unsigned.ipa
          mkdir -p ios/dist/Payload
          cp -R "$APP_PATH" ios/dist/Payload/
          (cd ios/dist && zip -qry ../app-unsigned.ipa Payload)
          ls -lh ios/app-unsigned.ipa

      - name: 发布到 Releases（固定链接 ipa-latest，不占 Actions 存储额度）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCLUDE_SHARE_EXT: ${{ inputs.include_share_extension }}
        run: |
          set -e
          cd ..
          VER=$(node -e "console.log('v'+require('./lifelog-app/app.json').expo.version)")
          BUILD=$(node -e "console.log(require('./lifelog-app/app.json').expo.ios.buildNumber)")
          if [ "$INCLUDE_SHARE_EXT" = "true" ]; then
            EXT_NOTE="含 iOS 分享扩展（需支持 App Group 的付费开发者证书或 TrollStore）。"
          else
            EXT_NOTE="免费自签兼容版（已关闭依赖 App Group 的分享扩展，支持用普通免费 Apple ID 通过 Sideloadly / AltStore / SideStore 直接自签安装，主 App 全部功能可用）。"
          fi
          TAG="ipa-latest"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "最新 iOS IPA（未签名，用于自签安装）" \
            --notes "每次构建自动更新。下载下面的 app-unsigned.ipa 后，用 Sideloadly / AltStore / SideStore 自签安装到 iPhone。"
          gh release upload "$TAG" lifelog-app/ios/app-unsigned.ipa --clobber
          NOTES=$(printf '版本 %s（build %s）。\n\n%s\n\n### 安装步骤（Windows + 免费 Apple ID）\n1. 下载下方的 `app-unsigned.ipa`；\n2. 在 Windows 安装并打开 Sideloadly（https://sideloadly.io/），USB 连接 iPhone；\n3. 拖入 `app-unsigned.ipa`，输入你的普通免费 Apple ID 点击 Start；\n4. 首次打开前到 iPhone「设置 → 通用 → VPN 与设备管理」信任证书即可。' "$VER" "$BUILD" "$EXT_NOTE")
          gh release edit "$TAG" --title "最新 iOS IPA  $VER (build $BUILD)" --notes "$NOTES"
          echo "下载页：https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
